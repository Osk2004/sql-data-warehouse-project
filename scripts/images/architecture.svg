<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-label="Medallion architecture: sources to Bronze, Silver, Gold, then analytics" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#161b22"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .title { fill: #e6edf3; font-size: 22px; font-weight: 700; }
    .sub { fill: #8b949e; font-size: 12px; }
    .h { font-size: 20px; font-weight: 700; }
    .t { fill: #c9d1d9; font-size: 12px; }
    .box { fill: #161b22; stroke-width: 2; }
    .flow { fill: none; stroke: #58a6ff; stroke-width: 2.5; stroke-dasharray: 7 7; animation: dash 1s linear infinite; }
    .pulse { animation: pulse 2.8s ease-in-out infinite; }
    .d1 { animation-delay: .0s; } .d2 { animation-delay: .7s; } .d3 { animation-delay: 1.4s; }
    @keyframes dash { to { stroke-dashoffset: -28; } }
    @keyframes pulse { 0%,100% { stroke-opacity: .35; } 50% { stroke-opacity: 1; } }
  </style>

  <rect width="1000" height="400" rx="16" fill="url(#bg)"/>
  <text x="500" y="42" text-anchor="middle" class="title">Data Warehouse · Medallion Architecture</text>
  <text x="500" y="62" text-anchor="middle" class="sub">Raw → Cleansed → Business-ready · MySQL</text>

  <!-- Sources -->
  <rect class="box" x="20" y="110" width="130" height="70" rx="10" stroke="#8b949e"/>
  <text x="85" y="140" text-anchor="middle" class="h" style="font-size:15px;fill:#e6edf3">Source A</text>
  <text x="85" y="160" text-anchor="middle" class="t">CSV files</text>
  <rect class="box" x="20" y="225" width="130" height="70" rx="10" stroke="#8b949e"/>
  <text x="85" y="255" text-anchor="middle" class="h" style="font-size:15px;fill:#e6edf3">Source B</text>
  <text x="85" y="275" text-anchor="middle" class="t">CSV files</text>

  <!-- Bronze -->
  <rect class="box pulse d1" x="210" y="95" width="150" height="220" rx="12" stroke="#cd7f32" filter="url(#glow)"/>
  <text x="285" y="128" text-anchor="middle" class="h" fill="#cd7f32">BRONZE</text>
  <text x="285" y="150" text-anchor="middle" class="sub">Raw ingestion</text>
  <text x="285" y="188" text-anchor="middle" class="t">As-is source data</text>
  <text x="285" y="210" text-anchor="middle" class="t">Bulk load</text>
  <text x="285" y="232" text-anchor="middle" class="t">No transformations</text>

  <!-- Silver -->
  <rect class="box pulse d2" x="420" y="95" width="150" height="220" rx="12" stroke="#c0c0c0" filter="url(#glow)"/>
  <text x="495" y="128" text-anchor="middle" class="h" fill="#c0c0c0">SILVER</text>
  <text x="495" y="150" text-anchor="middle" class="sub">Cleansed &amp; standardized</text>
  <text x="495" y="188" text-anchor="middle" class="t">Data cleaning</text>
  <text x="495" y="210" text-anchor="middle" class="t">Normalization</text>
  <text x="495" y="232" text-anchor="middle" class="t">Quality checks</text>

  <!-- Gold -->
  <rect class="box pulse d3" x="630" y="95" width="150" height="220" rx="12" stroke="#ffd700" filter="url(#glow)"/>
  <text x="705" y="128" text-anchor="middle" class="h" fill="#ffd700">GOLD</text>
  <text x="705" y="150" text-anchor="middle" class="sub">Business-ready</text>
  <text x="705" y="188" text-anchor="middle" class="t">Star schema</text>
  <text x="705" y="210" text-anchor="middle" class="t">Fact &amp; dimension views</text>
  <text x="705" y="232" text-anchor="middle" class="t">Aggregated metrics</text>

  <!-- Consumers -->
  <rect class="box" x="840" y="110" width="140" height="70" rx="10" stroke="#3fb950"/>
  <text x="910" y="140" text-anchor="middle" class="h" style="font-size:15px;fill:#3fb950">Tableau</text>
  <text x="910" y="160" text-anchor="middle" class="t">Dashboards</text>
  <rect class="box" x="840" y="225" width="140" height="70" rx="10" stroke="#3fb950"/>
  <text x="910" y="255" text-anchor="middle" class="h" style="font-size:15px;fill:#3fb950">SQL Analysis</text>
  <text x="910" y="275" text-anchor="middle" class="t">Ad-hoc queries</text>

  <!-- Flow paths -->
  <path id="p1" class="flow" d="M150,145 C185,145 175,205 210,205"/>
  <path id="p2" class="flow" d="M150,260 C185,260 175,205 210,205"/>
  <path id="p3" class="flow" d="M360,205 L420,205"/>
  <path id="p4" class="flow" d="M570,205 L630,205"/>
  <path id="p5" class="flow" d="M780,205 C810,205 810,145 840,145"/>
  <path id="p6" class="flow" d="M780,205 C810,205 810,260 840,260"/>

  <!-- Moving particles -->
  <g filter="url(#glow)" fill="#58a6ff">
    <circle r="4"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p1"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="0.5s" repeatCount="indefinite"><mpath href="#p2"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.5s" repeatCount="indefinite"><mpath href="#p3"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="1.5s" begin="0.4s" repeatCount="indefinite"><mpath href="#p4"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" repeatCount="indefinite"><mpath href="#p5"/></animateMotion></circle>
    <circle r="4"><animateMotion dur="2s" begin="0.6s" repeatCount="indefinite"><mpath href="#p6"/></animateMotion></circle>
  </g>

  <!-- Footer -->
  <text x="285" y="350" text-anchor="middle" class="sub">Extract &amp; Load</text>
  <text x="495" y="350" text-anchor="middle" class="sub">Transform</text>
  <text x="705" y="350" text-anchor="middle" class="sub">Model &amp; Serve</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
