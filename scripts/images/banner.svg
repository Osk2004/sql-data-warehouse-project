<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 240" width="1000" height="240" role="img" aria-label="SQL Data Warehouse Project banner" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1020"/>
      <stop offset="1" stop-color="#101a33"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0" gradientUnits="objectBoundingBox">
      <stop offset="0" stop-color="#cd7f32"/>
      <stop offset="0.5" stop-color="#e6edf3"/>
      <stop offset="1" stop-color="#ffd700"/>
      <animateTransform attributeName="gradientTransform" type="translate" from="-1 0" to="1 0" dur="4s" repeatCount="indefinite"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#58a6ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#58a6ff" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <style>
    text { font-family: "Segoe UI", Helvetica, Arial, sans-serif; }
    .big { font-size: 56px; font-weight: 800; }
    .sub { font-size: 18px; fill: #8b949e; letter-spacing: 2px; }
    .chip { font-size: 13px; font-weight: 600; }
    @keyframes float { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    @keyframes twinkle { 0%,100% { opacity: .25; } 50% { opacity: 1; } }
    .n1 { animation: float 4s ease-in-out infinite, twinkle 3s ease-in-out infinite; }
    .n2 { animation: float 5s ease-in-out infinite .8s, twinkle 4s ease-in-out infinite .5s; }
    .n3 { animation: float 3.5s ease-in-out infinite 1.4s, twinkle 3.5s ease-in-out infinite 1s; }
  </style>

  <rect width="1000" height="240" rx="16" fill="url(#bg)"/>
  <rect width="1000" height="240" rx="16" fill="url(#grid)"/>

  <!-- scan line -->
  <rect x="0" y="-60" width="1000" height="60" fill="url(#scan)">
    <animate attributeName="y" from="-60" to="240" dur="4s" repeatCount="indefinite"/>
  </rect>

  <!-- floating data nodes -->
  <g filter="url(#glow)">
    <circle class="n1" cx="90" cy="60" r="5" fill="#cd7f32"/>
    <circle class="n2" cx="150" cy="180" r="4" fill="#c0c0c0"/>
    <circle class="n3" cx="910" cy="55" r="5" fill="#ffd700"/>
    <circle class="n1" cx="860" cy="185" r="4" fill="#58a6ff"/>
    <circle class="n2" cx="940" cy="130" r="3" fill="#cd7f32"/>
    <circle class="n3" cx="60" cy="125" r="3" fill="#ffd700"/>
  </g>
  <g stroke="#58a6ff" stroke-opacity="0.25" stroke-width="1" fill="none">
    <path d="M90,60 L150,180 L60,125 Z"/>
    <path d="M910,55 L860,185 L940,130 Z"/>
  </g>

  <!-- title -->
  <text x="500" y="110" text-anchor="middle" class="big" fill="url(#title)" filter="url(#glow)">SQL DATA WAREHOUSE</text>
  <text x="500" y="148" text-anchor="middle" class="sub">MYSQL WORKBENCH · ETL · DATA MODELING · ANALYTICS</text>

  <!-- layer chips -->
  <g>
    <rect x="320" y="175" width="100" height="30" rx="15" fill="none" stroke="#cd7f32" stroke-width="2"/>
    <text x="370" y="195" text-anchor="middle" class="chip" fill="#cd7f32">BRONZE</text>
    <rect x="450" y="175" width="100" height="30" rx="15" fill="none" stroke="#c0c0c0" stroke-width="2"/>
    <text x="500" y="195" text-anchor="middle" class="chip" fill="#c0c0c0">SILVER</text>
    <rect x="580" y="175" width="100" height="30" rx="15" fill="none" stroke="#ffd700" stroke-width="2"/>
    <text x="630" y="195" text-anchor="middle" class="chip" fill="#ffd700">GOLD</text>
    <path d="M425,190 H445 M555,190 H575" stroke="#58a6ff" stroke-width="2" stroke-dasharray="4 4">
      <animate attributeName="stroke-dashoffset" from="0" to="-16" dur="1s" repeatCount="indefinite"/>
    </path>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
